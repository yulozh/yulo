name: Build yulo OS ARM64 RootFS

on:
  push:
    branches: [ main ]
    paths:
      - 'rootfs/**'
      - '.github/workflows/build-arm64.yml'
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/lib/jvm /opt/hostedtoolcache/CodeQL /sw /opt/pipx
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Install QEMU and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-user-static binfmt-support debootstrap xz-utils
          sudo update-binfmts --enable
          echo "QEMU installed"
          qemu-aarch64-static --version

      - name: Build ARM64 rootfs with debootstrap
        run: |
          sudo mkdir -p /mnt/arm64-rootfs
          # Bootstrap Ubuntu 26.04 (resolute) ARM64 minimal
          sudo debootstrap --arch=arm64 --foreign resolute /mnt/arm64-rootfs http://ports.ubuntu.com/ubuntu-ports/
          echo "debootstrap stage 1 done"
          df -h /

      - name: Copy QEMU and run stage 2
        run: |
          sudo cp /usr/bin/qemu-aarch64-static /mnt/arm64-rootfs/usr/bin/
          sudo chroot /mnt/arm64-rootfs /debootstrap/debootstrap --second-stage
          echo "debootstrap stage 2 done"
          df -h /

      - name: Configure APT and install base packages
        run: |
          # Configure sources
          sudo tee /mnt/arm64-rootfs/etc/apt/sources.list <<'EOF'
          deb http://ports.ubuntu.com/ubuntu-ports/ resolute main restricted universe multiverse
          deb http://ports.ubuntu.com/ubuntu-ports/ resolute-updates main restricted universe multiverse
          deb http://ports.ubuntu.com/ubuntu-ports/ resolute-security main restricted universe multiverse
          EOF
          # Set hostname
          echo "yulo" | sudo tee /mnt/arm64-rootfs/etc/hostname
          # Set up resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee /mnt/arm64-rootfs/etc/resolv.conf
          # Mount proc/sys/dev
          sudo mount --bind /proc /mnt/arm64-rootfs/proc
          sudo mount --bind /sys /mnt/arm64-rootfs/sys
          sudo mount --bind /dev /mnt/arm64-rootfs/dev
          # Update and install base
          sudo chroot /mnt/arm64-rootfs apt-get update -qq
          sudo chroot /mnt/arm64-rootfs apt-get install -y --no-install-recommends \
            ubuntu-minimal \
            locales \
            tzdata \
            ca-certificates \
            curl \
            wget \
            vim-tiny \
            sudo \
            bash-completion \
            2>&1 | tail -5
          echo "Base packages installed"
          df -h /

      - name: Install GNOME desktop (minimal)
        run: |
          sudo chroot /mnt/arm64-rootfs apt-get install -y --no-install-recommends \
            gnome-shell \
            gnome-session \
            gnome-terminal \
            nautilus \
            gedit \
            gnome-control-center \
            gnome-tweaks \
            gnome-calculator \
            gnome-system-monitor \
            gnome-screenshot \
            gdm3 \
            xorg \
            xserver-xorg-input-all \
            xserver-xorg-video-all \
            pulseaudio \
            network-manager \
            network-manager-gnome \
            bluez \
            cups \
            2>&1 | tail -10
          echo "GNOME desktop installed"
          df -h /

      - name: Install Chromium and Chinese input
        run: |
          sudo chroot /mnt/arm64-rootfs apt-get install -y --no-install-recommends \
            chromium-browser \
            fcitx5 \
            fcitx5-chinese-addons \
            fcitx5-frontend-gtk3 \
            fcitx5-frontend-qt5 \
            im-config \
            fonts-noto-cjk \
            2>&1 | tail -5
          echo "Chromium and Chinese input installed"
          df -h /

      - name: Merge yulo rootfs customizations
        run: |
          sudo rsync -a rootfs/ /mnt/arm64-rootfs/
          sudo chmod -R a+rX /mnt/arm64-rootfs/usr/share/themes/ /mnt/arm64-rootfs/usr/share/icons/ /mnt/arm64-rootfs/usr/share/backgrounds/ 2>/dev/null || true
          sudo chmod +x /mnt/arm64-rootfs/usr/lib/yulo/*.sh 2>/dev/null || true
          # Update dconf
          sudo chroot /mnt/arm64-rootfs dconf update 2>/dev/null || true
          echo "yulo customizations merged"
          df -h /

      - name: Run cleanup and first-boot setup
        run: |
          # Run cleanup script
          sudo chroot /mnt/arm64-rootfs bash /usr/lib/yulo/cleanup-bloat.sh 2>&1 | tail -10 || true
          # Run first-boot setup
          sudo chroot /mnt/arm64-rootfs bash /usr/lib/yulo/first-boot-setup.sh 2>&1 | tail -10 || true
          # Run security hardening
          sudo chroot /mnt/arm64-rootfs bash /usr/lib/yulo/security-hardening.sh 2>&1 | tail -5 || true
          echo "Setup scripts run"
          df -h /

      - name: Create default user
        run: |
          sudo chroot /mnt/arm64-rootfs useradd -m -s /bin/bash -G sudo,audio,video,netdev yulo 2>/dev/null || true
          echo "yulo:yulo" | sudo chroot /mnt/arm64-rootfs chpasswd
          # Copy skel config
          sudo cp -r /mnt/arm64-rootfs/etc/skel/. /mnt/arm64-rootfs/home/yulo/ 2>/dev/null || true
          sudo chroot /mnt/arm64-rootfs chown -R yulo:yulo /home/yulo 2>/dev/null || true
          echo "Default user created (yulo/yulo)"
          df -h /

      - name: Clean up and unmount
        run: |
          set +e
          # Lazy unmount in case device is busy
          sudo umount -l /mnt/arm64-rootfs/proc 2>/dev/null
          sudo umount -l /mnt/arm64-rootfs/sys 2>/dev/null
          sudo umount -l /mnt/arm64-rootfs/dev 2>/dev/null
          sleep 2
          # Remove QEMU binary and temp files
          sudo rm -f /mnt/arm64-rootfs/usr/bin/qemu-aarch64-static 2>/dev/null
          sudo rm -f /mnt/arm64-rootfs/etc/resolv.conf 2>/dev/null
          # Clean apt cache
          sudo rm -rf /mnt/arm64-rootfs/var/cache/apt/archives/*.deb 2>/dev/null
          sudo rm -rf /mnt/arm64-rootfs/var/lib/apt/lists/* 2>/dev/null
          sudo rm -rf /mnt/arm64-rootfs/tmp/* 2>/dev/null
          echo "Cleanup done"
          df -h /
          sudo du -sh /mnt/arm64-rootfs 2>/dev/null || echo "du skipped"
          set -e

      - name: Package ARM64 rootfs
        run: |
          set -e
          echo "=== 磁盘空间 ==="
          df -h /
          echo "=== rootfs 大小 ==="
          sudo du -sh /mnt/arm64-rootfs
          OUTPUT_DIR="${{ github.workspace }}/output"
          mkdir -p "$OUTPUT_DIR"
          cd /mnt
          sudo tar -cJf "$OUTPUT_DIR/yulo-1.0-arm64-rootfs.tar.xz" -C arm64-rootfs .
          echo "打包完成"
          ls -lh "$OUTPUT_DIR/yulo-1.0-arm64-rootfs.tar.xz"
          sha256sum "$OUTPUT_DIR/yulo-1.0-arm64-rootfs.tar.xz" > "$OUTPUT_DIR/yulo-1.0-arm64-rootfs.tar.xz.sha256"
          cat "$OUTPUT_DIR/yulo-1.0-arm64-rootfs.tar.xz.sha256"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> $GITHUB_ENV

      - name: Upload ARM64 rootfs to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: yulo OS 1.0
          append_body: true
          body: |
            ## ARM64 版本（手机/树莓派/ARM设备）
            
            ARM64 rootfs 包，可直接导入到 Termux proot、UserLAnd 或其他 ARM64 Linux 容器中运行。
            
            ### 默认账号
            - 用户名: yulo
            - 密码: yulo
            
            ### Termux proot 导入方法
            ```bash
            # 安装 proot-distro
            pkg install proot-distro
            # 导入 rootfs
            proot-distro install yulo --tarball yulo-1.0-arm64-rootfs.tar.xz
            # 登录
            proot-distro login yulo
            ```
            
            ### UserLAnd 导入
            在 UserLAnd 中选择 "Import filesystem"，选择此 tar.xz 文件。
            
            ### 包含
            - Ubuntu 26.04 (resolute) ARM64
            - GNOME 桌面环境
            - 樱花粉主题（亮色+暗色）
            - yulo-shell 扩展（Win11 式底部状态栏）
            - Chromium 浏览器
            - Fcitx5 中文输入法
            - 安全加固
          files: |
            ${{ github.workspace }}/output/yulo-1.0-arm64-rootfs.tar.xz
            ${{ github.workspace }}/output/yulo-1.0-arm64-rootfs.tar.xz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
