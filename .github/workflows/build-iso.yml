name: Build yulo OS ISO

on:
  push:
    branches: [ main ]
    paths:
      - 'rootfs/**'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/lib/jvm /opt/hostedtoolcache/CodeQL /sw /opt/pipx
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y squashfs-tools xorriso p7zip-full rsync aria2

      - name: Download Ubuntu ISO
        run: |
          aria2c -x 16 -s 16 -k 1M --max-connection-per-server=16 \
            -o ubuntu.iso \
            "https://mirrors.kernel.org/ubuntu-releases/26.04/ubuntu-26.04-desktop-amd64.iso" \
            "https://releases.ubuntu.com/26.04/ubuntu-26.04-desktop-amd64.iso"
          ls -lh ubuntu.iso

      - name: Extract squashfs from ISO
        run: |
          set +e
          7z l ubuntu.iso 2>/dev/null | grep -i "squashfs"
          7z e ubuntu.iso -o. "casper/minimal.standard.live.squashfs" -y > /dev/null 2>&1
          if [ ! -f minimal.standard.live.squashfs ]; then
            7z e ubuntu.iso -o. "casper/filesystem.squashfs" -y > /dev/null 2>&1
          fi
          if [ ! -f minimal.standard.live.squashfs ] && [ ! -f filesystem.squashfs ]; then
            7z x ubuntu.iso -oiso-tmp -y > /dev/null 2>&1
            LARGEST=$(find iso-tmp -name "*.squashfs" -printf "%s %p\n" | sort -rn | head -1 | cut -d' ' -f2-)
            cp "$LARGEST" ./minimal.standard.live.squashfs
            rm -rf iso-tmp
          fi
          if [ -f minimal.standard.live.squashfs ]; then
            mv minimal.standard.live.squashfs filesystem.squashfs
          fi
          ls -lh filesystem.squashfs
          rm -f ubuntu.iso
          df -h /

      - name: Extract squashfs
        run: |
          sudo unsquashfs -d squashfs-root filesystem.squashfs
          rm filesystem.squashfs
          df -h /

      - name: Merge yulo rootfs
        run: |
          sudo rsync -a rootfs/ squashfs-root/
          sudo chmod -R a+rX squashfs-root/usr/share/themes/ squashfs-root/usr/share/icons/ squashfs-root/usr/share/backgrounds/ 2>/dev/null || true
          sudo chmod +x squashfs-root/usr/lib/yulo/*.sh 2>/dev/null || true
          sudo chroot squashfs-root dconf update 2>/dev/null || true
          echo "yulo rootfs merged"
          df -h /

      - name: Clean up bloat
        run: |
          set +e
          mkdir -p squashfs-root/proc squashfs-root/sys squashfs-root/dev
          sudo mount --bind /proc squashfs-root/proc 2>/dev/null
          sudo mount --bind /sys squashfs-root/sys 2>/dev/null
          sudo mount --bind /dev squashfs-root/dev 2>/dev/null
          sudo cp /etc/resolv.conf squashfs-root/etc/resolv.conf 2>/dev/null
          sudo chroot squashfs-root apt-get update -qq 2>/dev/null
          sudo chroot squashfs-root bash /usr/lib/yulo/cleanup-bloat.sh 2>/dev/null
          sudo umount squashfs-root/proc 2>/dev/null
          sudo umount squashfs-root/sys 2>/dev/null
          sudo umount squashfs-root/dev 2>/dev/null
          sudo rm -f squashfs-root/etc/resolv.conf 2>/dev/null
          echo "bloat cleaned (or skipped)"
          df -h /

      - name: Repack squashfs
        run: |
          sudo mksquashfs squashfs-root filesystem.squashfs -comp xz -b 1M -noappend
          sudo rm -rf squashfs-root
          ls -lh filesystem.squashfs
          df -h /

      - name: Re-download and extract full ISO
        run: |
          aria2c -x 16 -s 16 -k 1M --max-connection-per-server=16 \
            -o ubuntu.iso \
            "https://mirrors.kernel.org/ubuntu-releases/26.04/ubuntu-26.04-desktop-amd64.iso" \
            "https://releases.ubuntu.com/26.04/ubuntu-26.04-desktop-amd64.iso"
          mkdir iso-extract
          7z x ubuntu.iso -oiso-extract -y > /dev/null 2>&1
          chmod -R +w iso-extract
          rm ubuntu.iso
          SQUASHFS=$(find iso-extract -name "*.squashfs" -printf "%s %p\n" | sort -rn | head -1 | cut -d' ' -f2-)
          echo "Replacing: $SQUASHFS"
          rm -f "$SQUASHFS"
          mv filesystem.squashfs "$SQUASHFS"
          echo "ISO extracted and squashfs replaced"
          df -h /

      - name: Generate yulo ISO
        run: |
          set +e
          EFI_IMG=$(find iso-extract -name "efi.img" 2>/dev/null | head -1)
          BIOS_IMG=$(find iso-extract -name "eltorito.img" 2>/dev/null | head -1)
          BOOT_CAT=$(find iso-extract -name "boot.catalog" 2>/dev/null | head -1)
          echo "EFI: $EFI_IMG"
          echo "BIOS: $BIOS_IMG"
          echo "Catalog: $BOOT_CAT"
          find iso-extract -path "*/boot/*" \( -name "*.img" -o -name "*.efi" \) 2>/dev/null | head -10
          XORRISO="xorriso -as mkisofs -r -V yulo -J -joliet-long -l -iso-level 3"
          if [ -n "$BOOT_CAT" ]; then
            REL=$(echo "$BOOT_CAT" | sed 's|^iso-extract/||')
            XORRISO="$XORRISO -c $REL"
          fi
          if [ -n "$BIOS_IMG" ]; then
            REL=$(echo "$BIOS_IMG" | sed 's|^iso-extract/||')
            XORRISO="$XORRISO -b $REL -no-emul-boot -boot-load-size 4 -boot-info-table"
          fi
          if [ -n "$EFI_IMG" ]; then
            REL=$(echo "$EFI_IMG" | sed 's|^iso-extract/||')
            XORRISO="$XORRISO -eltorito-alt-boot -e $REL -no-emul-boot -isohybrid-gpt-basdat"
          fi
          XORRISO="$XORRISO -o yulo-1.0-desktop-amd64.iso iso-extract"
          echo "Command: $XORRISO"
          eval $XORRISO 2>&1 | tail -15
          if [ ! -f yulo-1.0-desktop-amd64.iso ]; then
            echo "Boot files not found, creating basic ISO..."
            xorriso -as mkisofs -r -V yulo -J -joliet-long -l -o yulo-1.0-desktop-amd64.iso iso-extract 2>&1 | tail -5
          fi
          rm -rf iso-extract
          ls -lh yulo-1.0-desktop-amd64.iso
          df -h /

      - name: SHA256
        run: |
          sha256sum yulo-1.0-desktop-amd64.iso > yulo-1.0-desktop-amd64.iso.sha256
          cat yulo-1.0-desktop-amd64.iso.sha256
          ls -lh yulo-1.0-desktop-amd64.iso

      - name: Split ISO (GitHub 2GB limit)
        run: |
          split -b 1500M yulo-1.0-desktop-amd64.iso yulo-1.0-desktop-amd64.iso.part-
          ls -lh yulo-1.0-desktop-amd64.iso.part-*
          cat > recombine.sh << 'EOF'
#!/bin/bash
cat yulo-1.0-desktop-amd64.iso.part-* > yulo-1.0-desktop-amd64.iso
sha256sum -c yulo-1.0-desktop-amd64.iso.sha256
echo "Done!"
EOF
          chmod +x recombine.sh

      - name: Delete old release
        run: |
          gh release delete v1.0 -y 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: yulo OS 1.0
          body: |
            yulo OS 1.0 (Sakura) - 基于 Ubuntu 26.04 LTS 的定制系统
            
            ## 特性
            - 樱花粉专业主题（亮色+暗色）
            - Win11 式底部状态栏（半透明白/黑灰）
            - 一键暗色模式切换（太阳/月亮）
            - 4K 动态壁纸（无声音）
            - Chromium 浏览器（已移除 Firefox）
            - 安全加固 + 漏洞扫描
            - 无遥测、无云端后门
            - 窗口边缘拖动调大小
            - 已清理系统冗余（游戏、Thunderbird、示例文件等）
            
            ## 下载和合并
            ISO 超过 2GB 已分卷。下载所有 part 文件后：
            ```bash
            cat yulo-1.0-desktop-amd64.iso.part-* > yulo-1.0-desktop-amd64.iso
            sha256sum -c yulo-1.0-desktop-amd64.iso.sha256
            ```
            或运行 recombine.sh
            
            ## 安装
            用 VMware / VirtualBox / QEMU 加载 ISO，或用 dd / Rufus 写到 U 盘。
          files: |
            yulo-1.0-desktop-amd64.iso.part-*
            yulo-1.0-desktop-amd64.iso.sha256
            recombine.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
